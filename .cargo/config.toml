[alias]
xtask = "run --package xtask --"

# Local dev: rustc invokes sccache when installed (`brew install sccache`).
# Set SCCACHE_DIR to a persistent path (e.g. ~/.cache/sccache); otherwise sccache uses a temp dir.
[build]
rustc-wrapper = "sccache"

# Enable tokio_unstable for task dump
# Not supported for non-linux
[target.'cfg(target_os = "linux")']
rustflags = [
    "--cfg", "tokio_unstable",
    "-C", "force-frame-pointers",
]

[env]
CXXFLAGS = "-fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"
CFLAGS = "-fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"
# Proxy request-handling futures are huge in debug builds; the default ~2 MiB
# per-test thread stack overflows for MCP/gateway integration tests. cargo sets
# this for every test run so no manual `RUST_MIN_STACK=...` prefix is needed.
RUST_MIN_STACK = "8388608"
